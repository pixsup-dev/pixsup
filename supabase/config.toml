# Used by `supabase functions deploy`.
project_id = "qcouyhzvapgknfvrpakt"

# The gateway's JWT check is off for every function: each one decides access
# itself. analyzePostMedia, deleteAccount and createBoostCheckout verify the
# signed-in user in code (callerOf), stripeWebhook checks Stripe's signature,
# and seedNewsPosts is safe to call by anyone (cron and the app's
# refresh button) because it only tops the grid up to a capped amount.
[functions.analyzePostMedia]
verify_jwt = false

[functions.seedNewsPosts]
verify_jwt = false

[functions.deleteAccount]
verify_jwt = false

[functions.cleanupExpiredPosts]
verify_jwt = false

[functions.createBoostCheckout]
verify_jwt = false

[functions.stripeWebhook]
verify_jwt = false
